[package]
name = "pelican_ui"
version = "2.2.0"
edition = "2024"
description = "Standard UI tools and components built off Pelican UI of the RAMP stack."
license = "BSD-3-Clause"
repository = "https://github.com/ramp-stack/pelican_ui"

[lib]
name = "pelican_ui"
path = "src/lib.rs"

[features]
demo = ["dep:ramp"]

[[bin]]
name = "pelican_ui"
path = "src/main.rs"
required-features = ["demo"]

[dependencies]
media = {package = "media2", version = "0.1.0", path = "../media"}
uuid = { version = "1.16.0", features = ["v4", "js"] }
hex = "0.4.3"
include_dir = "0.7.4"
bardecoder = "0.5"
qrcode = {version = "0.14.1", default-features = false}
image = "0.24.9"
base64 = "0.22"
ptsd = {package = "ptsd2", version = "0.1.3", path = "../ptsd"}
prism = {package = "prism2", version = "3.0.0", path = "../prism"}
ramp = {package = "ramp2", version = "3.0.0", optional = true, path = "../ramp"}
serde = "1.0.228"
unicode-segmentation = "1.13.3"
ureq = { version = "2", features = ["json"] }
serde_json = "1"
futures = {version = "0.3.34", default-features = false, features = ["std"]}

[patch.crates-io]
air = {path = "../air"}
