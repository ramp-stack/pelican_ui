[package]
name = "pelican_ui"
version = "2.2.0"
edition = "2024"
description = "Standard UI tools and components built off Pelican UI of the RAMP stack."
license = "BSD-3-Clause"
repository = "https://github.com/ramp-stack/pelican_ui"

[lib]
name = "pelican_ui"
path = "src/lib.rs"

[features]
demo = ["dep:ramp"]

[[bin]]
name = "pelican_ui"
path = "src/main.rs"
required-features = ["demo"]

[dependencies]
uuid = { version = "1.16.0", features = ["v4", "js"] }
hex = "0.4.3"
include_dir = "0.7.4"
chrono = "0.4.42"
quircs = "0.10.3"
rqrr = "0.10"
bardecoder = "0.5"
qrcode = "0.14.1"
imageproc = "0.25.0"
image = "0.24.9"
base64 = "0.22"
nsvg = "0.5.1"
ptsd = {package = "ptsd2", version = "0.1.3", path = "../ptsd"}
prism = {package = "prism2", version = "2.0.0"}
ramp = {package = "ramp2", version = "2.0.0", optional = true}
serde = "1.0.228"
unicode-segmentation = "1.13.3"
ureq = { version = "2", features = ["json"] }
serde_json = "1"
futures = "0.3.34"
